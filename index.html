let IMGBB_KEY = null;
async function getImgBBKey(){
  if(IMGBB_KEY) return IMGBB_KEY;
  if(!loggedIn||!currentUser) throw new Error('Not logged in');
  const snap=await getDoc(doc(db,'config','keys'));
  if(!snap.exists()) throw new Error('Config missing');
  IMGBB_KEY=snap.data().imgbb;
  return IMGBB_KEY;
}

/* ── UPLOAD STATUS ── */
function showUploadStatus(t){const el=document.getElementById('uploadStatus'),tx=document.getElementById('uploadStatusText');if(el&&tx){tx.textContent=t;el.style.display='inline-flex';}}
function hideUploadStatus(){const el=document.getElementById('uploadStatus');if(el)el.style.display='none';}

/* ── IMGBB UPLOAD ── */
async function uploadToImgBB(file){
  const key=await getImgBBKey();
  const fd=new FormData(); fd.append('image',file);
  const res=await fetch('https://api.imgbb.com/1/upload?key='+key,{method:'POST',body:fd});
  const j=await res.json();
  if(!j.success) throw new Error(j.error?.message||'ImgBB upload failed');
  return j.data.url;
}

async function handleEditorImageUpload(input){
  if(!loggedIn||!currentUser){jAlert('Log in to upload images.');input.value='';return;}
  const siteName=document.getElementById('siteName').value.trim();
  if(!siteName){jAlert('Give your site a name before uploading images.');input.value='';return;}
  const files=Array.from(input.files); if(!files.length) return;
  input.value=''; let processed=0;
  for(const file of files){
    try{
      showUploadStatus('Uploading '+(processed+1)+' / '+files.length+'…');
      const url=await uploadToImgBB(file);
      insertImgCard(url); processed++; isDirty=true;
    }catch(err){console.error(err);jAlert('Failed to upload "'+file.name+'":<br><small>'+err.message+'</small>');}
  }
  hideUploadStatus();
  if(processed>0) jAlert('✅ '+processed+' image'+(processed>1?'s':'')+' uploaded — drag to position, resize from corner.');
}
window.handleEditorImageUpload=handleEditorImageUpload;

/* ── OVERLAY CARD FACTORY ── */
function _makeOverlayCard(innerEl, extraClass){
  const overlay=document.getElementById('fw-overlay')||document.getElementById('imgDragOverlay');
  const card=document.createElement('div');
  card.className='img-card'+(extraClass?' '+extraClass:'');
  card.style.left='30px'; card.style.top='30px';
  const handle=document.createElement('div'); handle.className='ic-handle';
  const delBtn=document.createElement('button'); delBtn.className='ic-del'; delBtn.textContent='✕'; delBtn.title='Remove';
  delBtn.onclick=(e)=>{e.stopPropagation();card.remove();isDirty=true;};
  card.appendChild(innerEl); card.appendChild(handle); card.appendChild(delBtn);
  overlay.appendChild(card);
  card.addEventListener('mousedown',function(e){
    if(e.target===handle||e.target===delBtn) return;
    if(extraClass==='html-card'&&e.target!==card){
      const rect=card.getBoundingClientRect();
      const onEdge=e.clientX-rect.left<12||rect.right-e.clientX<12||e.clientY-rect.top<12||rect.bottom-e.clientY<12;
      if(!onEdge) return;
    }
    e.preventDefault();
    const sx=e.clientX,sy=e.clientY,ol=parseInt(card.style.left,10)||0,ot=parseInt(card.style.top,10)||0;
    const mv=ev=>{card.style.left=(ol+ev.clientX-sx)+'px';card.style.top=(ot+ev.clientY-sy)+'px';};
    const up=()=>{document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);};
    document.addEventListener('mousemove',mv); document.addEventListener('mouseup',up);
  });
  handle.addEventListener('mousedown',function(e){
    e.preventDefault(); e.stopPropagation();
    const sx=e.clientX,sy=e.clientY,r=card.getBoundingClientRect(),sw=r.width,sh=r.height;
    const mv=ev=>{
  const nw=Math.max(40,sw+ev.clientX-sx);
  const nh=Math.max(20,sh+ev.clientY-sy);
  card.style.width=nw+'px';
  card.style.height=nh+'px';
  innerEl.style.width='100%';
  innerEl.style.height='100%';
  const iframeEl=innerEl.querySelector('iframe');
  if(iframeEl){iframeEl.style.width='100%';iframeEl.style.height='100%';}
};
    const up=()=>{document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);};
    document.addEventListener('mousemove',mv); document.addEventListener('mouseup',up);
  });
  return card;
}

function insertImgCard(src){
  const img=document.createElement('img');
  img.src=src; img.style.width='100%'; img.style.height='100%'; img.style.objectFit='contain'; img.draggable=false;
  const card=_makeOverlayCard(img,''); card.style.width='280px'; card.style.height='200px';
}
function insertHTMLCard(htmlString){
  const w=document.createElement('div'); w.className='html-card'; w.style.width='100%'; w.style.height='100%';
  const iframe=document.createElement('iframe');
  iframe.style.cssText='width:100%;height:100%;border:none;display:block;';
  iframe.setAttribute('sandbox','allow-scripts allow-same-origin');
  iframe.setAttribute('data-src',htmlString);
  w.appendChild(iframe);
  const card=_makeOverlayCard(w,'html-card'); card.style.width='500px'; card.style.height='320px';
  iframe.srcdoc=htmlString;
}
function serializeOverlayCards(){
  const overlay=document.getElementById('fw-overlay')||document.getElementById('imgDragOverlay');
  const cards=overlay.querySelectorAll('.img-card'),data=[];
  cards.forEach(card=>{
    const img=card.querySelector('img');
    const textEl=card.querySelector('[contenteditable]');
    const hd=card.querySelector('.html-card');
    if(img) data.push({type:'img',src:img.src,left:card.style.left,top:card.style.top,width:card.style.width,height:card.style.height,zIndex:card.style.zIndex||'0'});

function makeFloatingWindow(contentEl,title){
  const win=document.createElement('div'); win.className='float-win';

  const bar=document.createElement('div'); bar.className='float-win-bar';
  const ts=document.createElement('span'); ts.className='float-win-title'; ts.textContent=title;
  const bts=document.createElement('div'); bts.className='float-win-btns';
  const fb=document.createElement('button'); fb.className='fw-full'; fb.textContent='⛶';
  let isFS=false,sg=null;
  fb.onclick=()=>{if(!isFS){sg={l:win.style.left,t:win.style.top,w:win.style.width,h:win.style.height};win.style.cssText+=';left:0;top:0;width:100vw;height:100vh;border-radius:0;';isFS=true;}else{win.style.left=sg.l;win.style.top=sg.t;win.style.width=sg.w;win.style.height=sg.h;win.style.borderRadius='10px';isFS=false;}};
  const cb2=document.createElement('button'); cb2.className='fw-close'; cb2.textContent='✕'; cb2.onclick=()=>win.remove();

  rh.addEventListener('mousedown',function(e){e.preventDefault();const sx=e.clientX,sy=e.clientY,sw=win.offsetWidth,sh=win.offsetHeight;const mv=ev=>{win.style.width=Math.max(260,sw+ev.clientX-sx)+'px';win.style.height=Math.max(180,sh+ev.clientY-sy)+'px';};const up=()=>{document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);};document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up);});

/* ── EMAIL VALIDATION ── */
function isLikelyRealEmail(email){
  const re=/^[a-zA-Z0-9._%+\-]{2,}@[a-zA-Z0-9.\-]{2,}\.[a-zA-Z]{2,}$/;
  if(!re.test(email))return false;
  const[local,domain]=email.split('@');
  if(local.replace(/[^a-z0-9]/gi,'').length<2)return false;
  const parts=domain.split('.'),tld=parts[parts.length-1];
  if(tld.length<2||tld.length>6)return false;
  if(parts.slice(0,-1).join('.').replace(/[^a-z0-9]/gi,'').length<2)return false;
  return true;
}

    </div>

      <div style="font-size:11px;color:#bdc1c6;margin-bottom:4px;letter-spacing:.5px;">USERNAME</div>
      <input id="signupUser" placeholder="Username (min 3 chars)" style="width:100%;margin:0 0 8px;padding:8px;background:#303134;border:1px solid #5f6368;color:white;border-radius:6px;outline:none;">
      <div style="font-size:11px;color:#bdc1c6;margin-bottom:4px;margin-top:4px;letter-spacing:.5px;">EMAIL</div>

      <div style="font-size:11px;color:#bdc1c6;margin-bottom:4px;margin-top:4px;letter-spacing:.5px;">PASSWORD</div>
      <input id="signupPass" placeholder="Password (min 6 chars)" type="password" style="width:100%;margin:0 0 8px;padding:8px;background:#303134;border:1px solid #5f6368;color:white;border-radius:6px;outline:none;">
      <input id="signupConfirm" placeholder="Confirm Password" type="password" style="width:100%;margin:0 0 4px;padding:8px;background:#303134;border:1px solid #5f6368;color:white;border-radius:6px;outline:none;">
      <p id="signupError" style="color:#f28b82;font-size:12px;margin:6px 0 0;display:none;"></p>
      <button id="signupBtn" style="width:100%;margin-top:12px;padding:10px;background:#a855f7;color:white;border:none;border-radius:8px;font-weight:700;cursor:pointer;font-size:14px;">CREATE ACCOUNT</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);
  const showLE=(m)=>{const e=document.getElementById('loginError');e.textContent=m;e.style.display='block';};
  const showSE=(m)=>{const e=document.getElementById('signupError');e.textContent=m;e.style.display='block';};
  function activateTab(tab){
    const L=tab==='login';
    document.getElementById('panelLogin').style.display=L?'block':'none';
    document.getElementById('panelSignup').style.display=L?'none':'block';
    document.getElementById('tabLoginBtn').style.color=L?'#8ab4f8':'#bdc1c6';
    document.getElementById('tabLoginBtn').style.borderBottom=L?'2px solid #8ab4f8':'2px solid transparent';
    document.getElementById('tabSignupBtn').style.color=L?'#bdc1c6':'#a855f7';
    document.getElementById('tabSignupBtn').style.borderBottom=L?'2px solid transparent':'2px solid #a855f7';
  }
  document.getElementById('closeAuthBtn').onclick=()=>overlay.remove();
  document.getElementById('tabLoginBtn').onclick=()=>activateTab('login');
  document.getElementById('tabSignupBtn').onclick=()=>activateTab('signup');

  document.getElementById('loginBtn').onclick=async()=>{
    const username=document.getElementById('loginUser').value.trim();
    const password=document.getElementById('loginPass').value;
    if(!username||!password){showLE("All fields required.");return;} showLE("");
    try{
      // look up uid from publicUsers (public read) then fetch email from private users
      const pubSnap=await getDocs(publicUsersCol); let foundUid=null;
      pubSnap.forEach(d=>{if((d.data().username||'').toLowerCase()===username.toLowerCase())foundUid=d.id;});
      if(!foundUid){showLE("No account with that username found.");return;}
      const userDoc=await getDoc(doc(db,"users",foundUid));
      const foundEmail=userDoc.exists()?userDoc.data().email:null;
      if(!foundEmail){showLE("Account data missing. Try signing up again.");return;}
      const cred=await signInWithEmailAndPassword(auth,foundEmail,password);
      loggedIn=true; currentUser=cred.user.uid; currentEmail=cred.user.email; currentUsername=cred.user.displayName||username;
      updateUserChip(); overlay.remove(); if(callback)callback();
    }catch(err){
      if(err.code==='auth/wrong-password'||err.code==='auth/invalid-credential')showLE("Wrong password.");
      else if(err.code==='auth/too-many-requests')showLE("Too many attempts. Try again later.");
      else showLE(err.message);
    }
  };

  document.getElementById('signupBtn').onclick=async()=>{
    const username=document.getElementById('signupUser').value.trim();
    const email=document.getElementById('signupEmail').value.trim();
    const password=document.getElementById('signupPass').value;
    const confirm=document.getElementById('signupConfirm').value;
    if(!username||!email||!password||!confirm){showSE("All fields required.");return;}
    if(username.length<3){showSE("Username must be at least 3 characters.");return;}
    if(!/^[a-zA-Z0-9_\-\.]+$/.test(username)){showSE("Username: letters, numbers, _ - . only.");return;}
    if(!isLikelyRealEmail(email)){showSE("Enter a valid email address (e.g. you@gmail.com).");return;}
    if(password.length<6){showSE("Password must be at least 6 characters.");return;}
    if(password!==confirm){showSE("Passwords don't match.");return;}
    try{
      const pubSnap=await getDocs(publicUsersCol); let taken=false;
      pubSnap.forEach(d=>{if((d.data().username||'').toLowerCase()===username.toLowerCase())taken=true;});
      if(taken){showSE("That username is already taken.");return;}
      const cred=await createUserWithEmailAndPassword(auth,email,password);
      await updateProfile(cred.user,{displayName:username});
      await saveUserProfile(cred.user.uid,username,email);
      loggedIn=true; currentUser=cred.user.uid; currentEmail=email; currentUsername=username;
      updateUserChip(); overlay.remove(); jAlert("Welcome to Learning and fun!, <b>@"+username+"</b> 🎉"); if(callback)callback();
    }catch(err){
      if(err.code==='auth/email-already-in-use')showSE("An account with that email already exists 👬.");
      else if(err.code==='auth/weak-password')showSE("Password too weak 🏋 (min 6 chars).");
      else if(err.code==='auth/invalid-email')showSE("That doesn't look like a valid email address come on you're better than this .");
      else showSE(err.message);
    }
  };
}

/* ── LAUNCH SITE ── */
function launchSite(id){
  const site=netData[id]; if(!site){jAlert('Site not found.');return;}
  const bg=site.bgColor||'#ffffff';
  const r=parseInt(bg.slice(1,3)||'ff',16),g=parseInt(bg.slice(3,5)||'ff',16),b=parseInt(bg.slice(5,7)||'ff',16);
  const fg=(0.299*r+0.587*g+0.114*b)/255>.5?'#111':'#eee';
  let cardsHTML='';
  if(site.cards){try{JSON.parse(site.cards).forEach(c=>{if(c.type==='img')cardsHTML+='<img src="'+c.src+'" style="position:absolute;left:'+c.left+';top:'+c.top+';width:'+(c.width||'280px')+';height:'+(c.height||'200px')+';object-fit:contain;border-radius:6px;max-width:none;z-index:'+(c.zIndex||0)+';">';else if(c.type==='html')cardsHTML+='<iframe srcdoc="'+c.html.replace(/"/g,'&quot;')+'" sandbox="allow-scripts allow-same-origin" style="position:absolute;left:'+c.left+';top:'+c.top+';width:'+(c.width||'200px')+';height:'+(c.height||'80px')+';border:none;box-sizing:border-box;z-index:'+(c.zIndex||0)+';">';else if(c.type==='text')cardsHTML+='<iframe srcdoc="'+('<style>html,body{margin:0;padding:0;background:transparent;font-size:16px;font-family:sans-serif;word-break:break-word;}body{padding:8px;}</style>'+c.text).replace(/"/g,'&quot;')+'" sandbox="allow-scripts" style="position:absolute;left:'+c.left+';top:'+c.top+';width:'+(c.width||'200px')+';height:'+(c.height||'60px')+';border:none;box-sizing:border-box;z-index:'+(c.zIndex||0)+';background:transparent;">';});}catch(e){}}
  const html='<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><style>html,body{margin:0;padding:0;width:100%;height:100%;background:'+bg+';color:inherit;}a{color:#1a73e8;}*{box-sizing:border-box;}</style></head><body><div style="position:relative;width:100%;min-height:100%;background:'+bg+';">'+(site.h||'')+'<div style="position:relative;width:100%;min-height:500px;">'+cardsHTML+'</div></div></body></html>';
  const iframe=document.createElement('iframe');
  iframe.style.cssText="width:100%;height:100%;border:none;display:block;";
  iframe.setAttribute('sandbox','allow-scripts allow-same-origin allow-forms allow-modals allow-popups');
  iframe.srcdoc=html;
  const wrap=document.createElement('div'); wrap.style.cssText="width:100%;height:100%;"; wrap.appendChild(iframe);
  makeFloatingWindow(wrap,id+'.jat');
}
window.launchSite=launchSite;

}

/* ── TOOLBAR SYNC ── */
document.getElementById('richEditor').addEventListener('keyup',syncToolbar);
document.getElementById('richEditor').addEventListener('mouseup',syncToolbar);
document.getElementById('richEditor').addEventListener('input',()=>{isDirty=true;});
function syncToolbar(){
  try{
    const sel=window.getSelection(); if(!sel||!sel.anchorNode)return;
    const node=sel.anchorNode.nodeType===3?sel.anchorNode.parentElement:sel.anchorNode;
    const cs=window.getComputedStyle(node),fs=parseFloat(cs.fontSize);
    if(fs)document.getElementById('fontSizeInput').value=Math.round(fs);
    const ff=cs.fontFamily.split(',')[0].replace(/['"]/g,'').trim();
    const sel2=document.getElementById('fontFamilySelect');
    for(let i=0;i<sel2.options.length;i++){if(sel2.options[i].value.toLowerCase()===ff.toLowerCase()){sel2.selectedIndex=i;break;}}
  }catch(e){}
}

setFbStatus('loading','⏳ Connecting…');
</script>
